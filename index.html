<!doctype html>
<!-- Classe "light" fixa o tema claro: o app não tem tema escuro completo e,
     sem ela, o dark mode do sistema ativava variantes dark: isoladas (barras pretas) -->
<html lang="pt-BR" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS não lê o manifesto: precisa destas metas para abrir em tela cheia
         quando adicionado à Tela de Início -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Campo" />
    <meta name="description" content="Plataforma de pesquisas de campo: coleta offline, geolocalização e relatórios." />
    <title>Entrevista Pro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
